<svg viewBox="0 0 560 600" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Lanky Services">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16281b"/>
      <stop offset="0.55" stop-color="#0b150e"/>
      <stop offset="1" stop-color="#070b08"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9ee23f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9ee23f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2fd0ef" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2fd0ef" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ee23f"/>
      <stop offset="1" stop-color="#2fd0ef"/>
    </linearGradient>
  </defs>

  <rect width="560" height="600" fill="url(#bg)"/>
  <rect width="560" height="600" fill="url(#dots)"/>
  <circle cx="150" cy="120" r="220" fill="url(#blob1)"/>
  <circle cx="430" cy="470" r="240" fill="url(#blob2)"/>

  <!-- glowing ring with recycle motif -->
  <g transform="translate(280 270)">
    <circle r="120" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.9"/>
    <circle r="120" fill="#000" opacity="0.10"/>
    <!-- minimal line-art van -->
    <g transform="translate(-96 -46)" fill="none" stroke="#f4f8f2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M6 20 H120 a10 10 0 0 1 10 10 V78 H6 a4 4 0 0 1-4-4 V24 a4 4 0 0 1 4-4 Z"/>
      <path d="M130 40 h22 l30 34 v18 h-52 Z"/>
      <line x1="150" y1="78" x2="182" y2="78"/>
      <circle cx="44" cy="90" r="15"/>
      <circle cx="150" cy="90" r="15"/>
    </g>
    <!-- recycle triangle -->
    <g transform="translate(0 58)" fill="#9ee23f">
      <path d="M-13 -3 L-3 -18 L7 -3 L1 -3 L1 8 L-7 8 Z"/>
      <path d="M15 0 L20 16 L4 13 L8 7 L-2 2 L4 -6 Z" opacity="0.85"/>
    </g>
  </g>

  <!-- brand chip -->
  <g transform="translate(60 520)">
    <rect x="-6" y="-26" width="240" height="46" rx="23" fill="rgba(0,0,0,0.35)" stroke="#9ee23f" stroke-opacity="0.4"/>
    <circle cx="18" cy="-3" r="6" fill="#9ee23f"/>
    <text x="38" y="2" font-family="'Space Grotesk',sans-serif" font-size="19" font-weight="700" fill="#f4f8f2">Central Coast · NSW</text>
  </g>
</svg>
