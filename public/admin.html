<!DOCTYPE html>
<html lang="en-AU">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Admin | Lanky Services</title>
 <meta name="robots" content="noindex, nofollow" />
 <meta name="theme-color" content="#0a0d0b" />
 <link rel="icon" type="image/png" href="/favicon.png" />
 <style>
  :root{
    --bg:#0a0d0b; --panel:#12170f; --panel2:#0d120b; --line:#26301f; --ink:#f3f6ef;
    --muted:#9aa793; --accent:#a3e635; --accent-ink:#10160c; --warn:#f4b942;
    --bad:#ff9a8a; --good:#a3e635; --blue:#67c1e6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color-scheme:dark}
  a{color:var(--accent)}
  button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;font:600 14px/1 inherit;
    background:var(--accent);color:var(--accent-ink)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.subtle{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  button.danger{background:transparent;color:var(--bad);border:1px solid #5a2a24}
  button.sm{padding:7px 11px;font-size:13px;border-radius:8px}
  button:disabled{opacity:.55;cursor:default}
  input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font:inherit;color-scheme:dark}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  .muted{color:var(--muted)}
  .err{color:var(--bad)}
  .hidden{display:none!important}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .grow{flex:1}
  .right{margin-left:auto}

  /* shell */
  .shell{display:flex;min-height:100vh}
  .side{width:210px;flex:0 0 210px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:18px 18px 8px;font-weight:800;letter-spacing:.02em}
  .brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
  nav.tabs{display:flex;flex-direction:column;padding:8px;gap:2px}
  nav.tabs a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
    color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
  nav.tabs a .ic{width:18px;text-align:center;opacity:.8}
  nav.tabs a:hover{background:var(--panel2)}
  nav.tabs a.active{background:var(--accent);color:var(--accent-ink)}
  nav.tabs a .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);
    font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px}
  nav.tabs a.active .badge{background:var(--accent-ink);color:var(--accent)}
  .side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:13px}
  .main{flex:1;min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(10,13,11,.92);backdrop-filter:blur(6px);z-index:5}
  .topbar h1{font-size:17px;margin:0}
  .content{padding:22px;max-width:1100px}

  /* cards, tables, tiles */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .tile .v{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
  .tile .s{font-size:12px;color:var(--muted);margin-top:2px}
  .tile.accent{border-color:#3f5a1f}
  .tile.accent .v{color:var(--accent)}

  table.tbl{width:100%;border-collapse:collapse}
  table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
    padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}
  table.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  table.tbl tr.clickable{cursor:pointer}
  table.tbl tr.clickable:hover td{background:var(--panel2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  th.num{text-align:right}

  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.new,.pill.sent{border-color:var(--blue);color:var(--blue)}
  .pill.draft{border-color:var(--line);color:var(--muted)}
  .pill.accepted,.pill.paid,.pill.done,.pill.handled{border-color:var(--accent);color:var(--accent)}
  .pill.declined,.pill.void,.pill.overdue,.pill.failed{border-color:var(--warn);color:var(--warn)}

  /* drawer / modal */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;justify-content:flex-end}
  .scrim.center{align-items:center;justify-content:center;padding:16px}
  .drawer{width:min(560px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line);
    overflow-y:auto;padding:20px}
  .modal{width:min(760px,100%);max-height:92vh;overflow-y:auto;background:var(--bg);
    border:1px solid var(--line);border-radius:16px;padding:20px}
  .drawer h2,.modal h2{margin:0 0 4px;font-size:19px}
  dl.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;margin:14px 0;font-size:14px}
  dl.kv dt{color:var(--muted)}
  dl.kv dd{margin:0;word-break:break-word}

  /* line item editor */
  .items{width:100%;border-collapse:collapse;margin:6px 0}
  .items th{font-size:11px;color:var(--muted);text-transform:uppercase;text-align:left;padding:4px 6px}
  .items td{padding:3px 4px;vertical-align:top}
  .items input{padding:8px 9px}
  .items .num input{text-align:right}

  /* toast */
  #toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:10px;padding:12px 14px;max-width:340px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.bad{border-left-color:var(--bad)}

  @media(max-width:820px){
    .shell{flex-direction:column}
    .side{width:auto;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .brand{padding:12px 14px}
    nav.tabs{flex-direction:row;flex-wrap:wrap;flex:1}
    .side-foot{margin:0;border:0;padding:8px 14px}
    .side{border-right:0;border-bottom:1px solid var(--line)}
    dl.kv{grid-template-columns:1fr}
  }
 </style>
</head>
<body>

<!-- Sign-in gate -->
<div id="gate" class="scrim center hidden">
  <div class="modal" style="max-width:420px">
    <h2>Lanky Services — Admin</h2>
    <p class="muted" style="margin-top:4px">Admin access only. Use your approved business email.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="row" style="margin-top:14px">
      <button id="signin">Sign in</button>
      <button id="signup" class="ghost">Create account</button>
      <button id="forgot" class="ghost">Forgot password?</button>
    </div>
    <p id="authMsg" class="err" style="min-height:20px"></p>
    <p class="muted" style="font-size:13px">First time? Enter your email + a password, then “Create account”.</p>
  </div>
</div>

<!-- App shell -->
<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand">Lanky Services<small>Admin portal</small></div>
    <nav class="tabs" id="nav">
      <a data-tab="dashboard" class="active"><span class="ic">▚</span>Dashboard</a>
      <a data-tab="leads"><span class="ic">✉</span>Leads<span class="badge hidden" id="leadsBadge">0</span></a>
      <a data-tab="quotes"><span class="ic">§</span>Quotes</a>
      <a data-tab="invoices"><span class="ic">₳</span>Invoices</a>
      <a data-tab="expenses"><span class="ic">⛽</span>Expenses</a>
      <a data-tab="reports"><span class="ic">▤</span>Reports</a>
      <a data-tab="settings"><span class="ic">⚙</span>Settings</a>
    </nav>
    <div class="side-foot">
      <div class="muted" id="who" style="font-size:12px;word-break:break-all"></div>
      <button id="signout" class="ghost sm" style="margin-top:8px">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><h1 id="pageTitle">Dashboard</h1>
      <button id="refresh" class="ghost sm right">Refresh</button>
    </div>
    <div class="content">
      <section id="tab-dashboard"></section>
      <section id="tab-leads" class="hidden"></section>
      <section id="tab-quotes" class="hidden"></section>
      <section id="tab-invoices" class="hidden"></section>
      <section id="tab-expenses" class="hidden"></section>
      <section id="tab-reports" class="hidden"></section>
      <section id="tab-settings" class="hidden"></section>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script type="module" src="/admin/app.js"></script>
</body>
</html>
