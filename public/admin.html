<!DOCTYPE html>
<html lang="en-AU">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Lanky Ops | Lanky Services</title>
 <meta name="robots" content="noindex, nofollow" />
 <meta name="theme-color" content="#0a0e0a" />
 <link rel="icon" type="image/png" href="/favicon.png" />
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
 <style>
  :root{
    --bg:#0a0e0a; --surface:#11170f; --surface-2:#161d13; --raised:#1b2417;
    --line:#232c1d; --line-2:#33402a;
    --ink:#f1f5ec; --muted:#93a288; --faint:#6f7d66;
    --lime:#a3e635; --lime-ink:#0f1509; --cyan:#5cc8e6;
    --paid:#7cc949; --sent:#5cc8e6; --warn:#f2b03a; --bad:#ef7a5c; --draft:#8a9a80;
    --f-display:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;
    --f-body:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
    --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
    --r:14px; --r-sm:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;color-scheme:dark}
  h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
  a{color:var(--cyan);text-decoration:none}
  .mono,.num,.tile .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

  button{font-family:var(--f-body);cursor:pointer;border:0;border-radius:var(--r-sm);
    padding:9px 14px;font-weight:600;font-size:14px;background:var(--lime);color:var(--lime-ink);transition:filter .12s,background .12s}
  button:hover{filter:brightness(1.05)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
  button.ghost:hover{background:var(--surface-2);filter:none}
  button.subtle{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2)}
  button.danger{background:transparent;color:var(--bad);border:1px solid #5a2f27}
  button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  button:disabled{opacity:.55;cursor:default;filter:none}

  input,textarea,select{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font:inherit;font-size:14px;color-scheme:dark}
  input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--lime) 55%,transparent);
    outline-offset:1px;border-color:transparent}
  textarea{resize:vertical}
  label{display:block;font-family:var(--f-display);font-size:11px;color:var(--muted);margin:12px 0 5px;
    text-transform:uppercase;letter-spacing:.07em;font-weight:600}

  .muted{color:var(--muted)} .err{color:var(--bad)} .hidden{display:none!important}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .grow{flex:1;min-width:0} .right{margin-left:auto}
  .label{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

  /* shell */
  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .side{background:linear-gradient(180deg,#0d130b,#0a0e0a);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--lime);color:var(--lime-ink);
    display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;flex:0 0 34px}
  .brand b{font-family:var(--f-display);font-weight:800;font-size:16px;display:block;line-height:1.1}
  .brand small{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  nav.tabs{display:flex;flex-direction:column;gap:2px;padding:8px 10px}
  nav.tabs a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--muted);
    text-decoration:none;font-weight:600;font-size:14px;cursor:pointer;transition:background .12s,color .12s}
  nav.tabs a svg{width:17px;height:17px;flex:0 0 17px}
  nav.tabs a .ic{width:17px;text-align:center;flex:0 0 17px}
  nav.tabs a:hover{background:var(--surface);color:var(--ink)}
  nav.tabs a.active{background:var(--lime);color:var(--lime-ink)}
  nav.tabs a .badge{margin-left:auto;font-family:var(--f-mono);font-size:11px;font-weight:600;
    background:var(--surface-2);color:var(--muted);padding:1px 7px;border-radius:999px}
  nav.tabs a.active .badge{background:rgba(15,21,9,.28);color:var(--lime-ink)}
  .side-foot{margin-top:auto;padding:13px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .side-foot .avatar{width:32px;height:32px;border-radius:50%;background:var(--raised);display:grid;place-items:center;
    font-weight:700;color:var(--lime);font-family:var(--f-display);flex:0 0 32px}
  .side-foot #who{font-size:11px;color:var(--faint);word-break:break-all}

  .main{min-width:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:15px 24px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(10,14,10,.86);backdrop-filter:blur(9px);z-index:6}
  .topbar h1{font-size:20px}
  .content{padding:22px 24px 60px;max-width:1180px}

  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:13px;margin-bottom:16px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
  .tile .k{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:9px;line-height:1}
  .tile .s{font-size:12.5px;color:var(--muted);margin-top:7px}
  .tile.accent{background:linear-gradient(160deg,#18220f,#12180f);border-color:var(--line-2)}
  .tile.accent .v{color:var(--lime)}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
  .card h2,.card h3{font-size:15px}
  .cap{color:var(--muted);font-size:12.5px}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}

  /* tables */
  table.tbl{width:100%;border-collapse:collapse}
  table.tbl thead th{text-align:left;padding:11px 15px;font-family:var(--f-display);font-size:11px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
  table.tbl td{padding:12px 15px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  table.tbl tr:last-child td{border-bottom:0}
  table.tbl tr.clickable{cursor:pointer;transition:background .12s}
  table.tbl tr.clickable:hover td{background:var(--surface-2)}
  .num,th.num{text-align:right} th.num{text-align:right}

  /* status chips (mapped onto .pill + status keyword) */
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:11px;font-weight:600;
    letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line-2);
    color:var(--muted);white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.new,.pill.accepted,.pill.paid,.pill.done,.pill.handled,.pill.invoiced{
    color:var(--paid);border-color:color-mix(in srgb,var(--paid) 42%,transparent)}
  .pill.sent{color:var(--sent);border-color:color-mix(in srgb,var(--sent) 42%,transparent)}
  .pill.declined,.pill.void,.pill.overdue,.pill.failed,.pill.email-failed{
    color:var(--warn);border-color:color-mix(in srgb,var(--warn) 42%,transparent)}

  /* chart */
  .chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
  .chart .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
  .chart .col{width:100%;border-radius:6px 6px 3px 3px;background:var(--line-2);transition:filter .15s}
  .chart .bar.on .col{background:linear-gradient(180deg,var(--lime),#7bbf22)}
  .chart .bar:hover .col{filter:brightness(1.18)}
  .chart .bar small{font-size:10px;color:var(--faint);font-family:var(--f-mono)}
  .chart .bar.on small{color:var(--lime)}

  /* attention list */
  .attn-item{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
  .attn-item:last-child{border-bottom:0}
  .attn-item .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px}
  .attn-item p{margin:0;font-size:13.5px} .attn-item small{color:var(--muted);font-size:12px}

  /* key-values */
  dl.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 14px;margin:14px 0;font-size:14px}
  dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;word-break:break-word}

  /* line-item editor */
  .items{width:100%;border-collapse:collapse;margin:6px 0}
  .items th{font-family:var(--f-display);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:4px 6px;font-weight:600}
  .items td{padding:3px 4px;vertical-align:top}
  .items input{padding:8px 9px}
  .items .num input{text-align:right;font-family:var(--f-mono)}

  /* overlays */
  .scrim{position:fixed;inset:0;background:rgba(3,6,3,.6);z-index:40;display:flex;justify-content:flex-end;
    animation:fade .15s ease}
  .scrim.center{align-items:center;justify-content:center;padding:16px}
  .drawer{width:min(480px,100%);height:100%;background:var(--bg);border-left:1px solid var(--line-2);
    overflow-y:auto;padding:22px;animation:slide .22s ease}
  .modal{width:min(760px,100%);max-height:92vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line-2);
    border-radius:16px;padding:22px;animation:pop .18s ease}
  .drawer h2,.modal h2{font-size:20px;margin-bottom:2px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
  @keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}

  /* toasts */
  #toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--surface);border:1px solid var(--line-2);border-left:4px solid var(--lime);
    border-radius:10px;padding:12px 14px;max-width:340px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.bad{border-left-color:var(--bad)}

  .banner{background:linear-gradient(100deg,#18220f,#101609);border:1px solid var(--line-2);border-radius:var(--r);
    padding:11px 15px;margin-bottom:16px;font-size:13px;color:var(--muted)}
  .menu-btn{display:none}

  @media(max-width:860px){
    .shell{grid-template-columns:1fr}
    .side{position:fixed;left:-260px;transition:left .2s;z-index:50;width:236px}
    .side.open{left:0}
    .menu-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
    .grid2{grid-template-columns:1fr}
    dl.kv{grid-template-columns:1fr}
  }
 </style>
</head>
<body>

<!-- Sign-in gate -->
<div id="gate" class="scrim center hidden">
  <div class="modal" style="max-width:420px">
    <h2>Lanky Services — Admin</h2>
    <p class="cap" style="margin-top:4px">Admin access only. Use your approved business email.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="row" style="margin-top:14px">
      <button id="signin">Sign in</button>
      <button id="signup" class="ghost">Create account</button>
      <button id="forgot" class="ghost">Forgot password?</button>
    </div>
    <p id="authMsg" class="err" style="min-height:20px"></p>
    <p class="cap">First time? Enter your email + a password, then “Create account”.</p>
  </div>
</div>

<!-- App shell -->
<div id="app" class="shell hidden">
  <aside class="side" id="side">
    <div class="brand"><div class="mark">L</div><div><b>Lanky Ops</b><small>Rubbish removal</small></div></div>
    <nav class="tabs" id="nav">
      <a data-tab="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
      <a data-tab="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Leads<span class="badge hidden" id="leadsBadge">0</span></a>
      <a data-tab="quotes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M14 4v5h5M8 13h8M8 17h5"/></svg>Quotes</a>
      <a data-tab="invoices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6"/></svg>Invoices</a>
      <a data-tab="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7 12 3 4 7v10l8 4 8-4Z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg>Price list</a>
      <a data-tab="expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Expenses</a>
      <a data-tab="income"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M17 8a4 4 0 0 0-5-2c-3 1-3 4 0 5s3 4 0 5a4 4 0 0 1-5-2"/></svg>Other income</a>
      <a data-tab="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V4M4 20h16M8 16l4-5 3 3 4-6"/></svg>Reports</a>
      <a data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7 7 0 0 0 0-2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1L15 3.5h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4L6.6 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4Z"/></svg>Settings</a>
    </nav>
    <div class="side-foot">
      <div class="avatar" id="avatar">M</div>
      <div style="min-width:0"><div style="font-size:13px;font-weight:600">Signed in</div><div class="muted" id="who"></div></div>
      <button id="signout" class="ghost sm" style="margin-left:auto">Out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="menu-btn" id="menuBtn"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
      <h1 id="pageTitle">Dashboard</h1>
      <button id="refresh" class="ghost sm right">Refresh</button>
    </div>
    <div class="content">
      <section id="tab-dashboard"></section>
      <section id="tab-leads" class="hidden"></section>
      <section id="tab-quotes" class="hidden"></section>
      <section id="tab-invoices" class="hidden"></section>
      <section id="tab-products" class="hidden"></section>
      <section id="tab-expenses" class="hidden"></section>
      <section id="tab-income" class="hidden"></section>
      <section id="tab-reports" class="hidden"></section>
      <section id="tab-settings" class="hidden"></section>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script type="module" src="/admin/app.js"></script>
</body>
</html>
