<!DOCTYPE html>
<html lang="en-AU">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Quote Admin | Lanky Services</title>
 <meta name="robots" content="noindex, nofollow" />
 <meta name="theme-color" content="#0a0d0b" />
 <link rel="icon" type="image/png" href="/favicon.png" />
 <style>
  :root{
    --bg:#0a0d0b; --panel:#12170f; --line:#26301f; --ink:#f3f6ef;
    --muted:#9aa793; --accent:#a3e635; --warn:#f4b942;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;letter-spacing:.02em}
  .wrap{max-width:1000px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0d120b;color:var(--ink);font:inherit;color-scheme:dark}
  button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font:600 15px/1 inherit;
    background:var(--accent);color:#10160c}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.6;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted);font-size:14px}
  .pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.new{border-color:var(--accent);color:var(--accent)}
  .pill.done{border-color:#3c4a33;color:#7f8f73}
  .quote h2{font-size:17px;margin:0 0 2px}
  .quote a{color:var(--accent)}
  .grid{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:12px 0;font-size:14px}
  .grid dt{color:var(--muted)}
  .grid dd{margin:0;word-break:break-word}
  .err{color:#ff9a8a;font-size:14px}
  .hidden{display:none}
  @media(max-width:520px){.grid{grid-template-columns:1fr}.grid dt{margin-top:6px}}
 </style>
</head>
<body>
<header>
  <h1>Lanky Services — Quote admin</h1>
  <div class="row">
    <span id="who" class="muted"></span>
    <button id="signout" class="ghost hidden">Sign out</button>
  </div>
</header>

<div class="wrap">
  <section id="authCard" class="card hidden" style="max-width:420px;margin:40px auto">
    <h2 style="margin-top:0;font-size:18px">Sign in</h2>
    <p class="muted">Admin access only. Use your approved business email.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="row" style="margin-top:14px">
      <button id="signin">Sign in</button>
      <button id="signup" class="ghost">Create account</button>
      <button id="forgot" class="ghost">Forgot password?</button>
    </div>
    <p id="authMsg" class="err" style="min-height:20px"></p>
    <p class="muted">First time? Enter your email and a password, then tap “Create account”. Forgot yours? Enter your email and tap “Forgot password?” — we’ll email you a reset link.</p>
  </section>


  <section id="app" class="hidden">
    <div class="card row" style="justify-content:space-between">
      <div class="row">
        <label for="filter" style="margin:0">Show</label>
        <select id="filter" style="width:auto">
          <option value="open">New / unhandled</option>
          <option value="all">All quotes</option>
          <option value="handled">Handled</option>
        </select>
      </div>
      <button id="refresh" class="ghost">Refresh</button>
    </div>
    <p id="listMsg" class="muted"></p>
    <div id="list"></div>
  </section>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';

const SUPABASE_URL = 'https://rstabgnhargvqwasplst.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SsCPt15jfIBlV75qC3Wt7A_4mhanmSk';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const authCard = $('authCard'), app = $('app'), authMsg = $('authMsg');

const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const fmt = (iso) => new Date(iso).toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' });

async function render() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    authCard.classList.remove('hidden');
    app.classList.add('hidden');
    $('signout').classList.add('hidden');
    $('who').textContent = '';
    return;
  }
  authCard.classList.add('hidden');
  app.classList.remove('hidden');
  $('signout').classList.remove('hidden');
  $('who').textContent = session.user.email;
  load();
}

async function load() {
  const mode = $('filter').value;
  $('listMsg').textContent = 'Loading…';
  let q = supabase.from('quote_requests').select('*').order('created_at', { ascending: false }).limit(200);
  if (mode === 'open') q = q.eq('handled', false);
  if (mode === 'handled') q = q.eq('handled', true);
  const { data, error } = await q;

  if (error) {
    $('listMsg').innerHTML = '<span class="err">' + esc(error.message) +
      ' — this account may not be on the approved admin list.</span>';
    $('list').innerHTML = '';
    return;
  }
  $('listMsg').textContent = data.length ? data.length + ' quote' + (data.length === 1 ? '' : 's') : 'No quotes here yet.';
  $('list').innerHTML = data.map(card).join('');
}

function card(q) {
  const rows = [
    ['Phone', q.phone ? `<a href="tel:${esc(q.phone.replace(/\s/g,''))}">${esc(q.phone)}</a>` : null],
    ['Email', q.email ? `<a href="mailto:${esc(q.email)}">${esc(q.email)}</a>` : null],
    ['Suburb', q.suburb ? esc(q.suburb) : null],
    ['Service', q.service ? esc(q.service) : null],
    ['Details', q.message ? esc(q.message) : null],
    ['From page', q.source_url ? `<a href="${esc(q.source_url)}" target="_blank" rel="noopener">${esc(q.source_url)}</a>` : null],
  ].filter(([, v]) => v);

  return `<article class="card quote">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <h2>${esc(q.name)}</h2>
        <div class="muted">${fmt(q.created_at)}</div>
      </div>
      <span class="pill ${q.handled ? 'done' : 'new'}">${q.handled ? 'Handled' : 'New'}</span>
    </div>
    <dl class="grid">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <label for="n-${q.id}">Internal notes</label>
    <textarea id="n-${q.id}" rows="2">${esc(q.admin_notes || "")}</textarea>
    <div class="row" style="margin-top:10px">
      <button data-save="${q.id}" class="ghost">Save notes</button>
      <button data-toggle="${q.id}" data-handled="${q.handled}">${q.handled ? 'Mark as new' : 'Mark handled'}</button>
    </div>
  </article>`;
}

$('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  btn.disabled = true;
  try {
    if (btn.dataset.save) {
      const notes = document.getElementById('n-' + btn.dataset.save).value;
      const { error } = await supabase.from('quote_requests')
        .update({ admin_notes: notes }).eq('id', btn.dataset.save);
      btn.textContent = error ? 'Save failed' : 'Saved';
      setTimeout(() => { btn.textContent = 'Save notes'; btn.disabled = false; }, 2000);
      return;
    }
    if (btn.dataset.toggle) {
      const next = btn.dataset.handled !== 'true';
      await supabase.from('quote_requests').update({ handled: next }).eq('id', btn.dataset.toggle);
      load();
    }
  } catch (_) { btn.disabled = false; }
});

$('filter').addEventListener('change', load);
$('refresh').addEventListener('click', load);

$('signin').addEventListener('click', async () => {
  authMsg.textContent = '';
  const { error } = await supabase.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value,
  });
  if (error) authMsg.textContent = error.message; else render();
});

$('signup').addEventListener('click', async () => {
  authMsg.textContent = '';
  const { error } = await supabase.auth.signUp({
    email: $('email').value.trim(), password: $('password').value,
  });
  if (error) { authMsg.textContent = error.message; return; }
  const { error: signInError } = await supabase.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value,
  });
  if (signInError) authMsg.textContent = signInError.message; else render();
});

$('signout').addEventListener('click', async () => {
  await supabase.auth.signOut();
  render();
});

render();
</script>
</body>
</html>
