<!DOCTYPE html>
<html lang="en-AU">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Server Errors | Lanky Services</title>
 <meta name="robots" content="noindex, nofollow" />
 <meta name="theme-color" content="#0a0d0b" />
 <link rel="icon" type="image/png" href="/favicon.png" />
 <style>
  :root{ --bg:#0a0d0b; --panel:#12170f; --line:#26301f; --ink:#f3f6ef;
    --muted:#9aa793; --accent:#a3e635; --warn:#f4b942; --bad:#ff9a8a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;letter-spacing:.02em}
  .wrap{max-width:1000px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0d120b;color:var(--ink);font:inherit;color-scheme:dark}
  button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font:600 15px/1 inherit;
    background:var(--accent);color:#10160c}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.6;cursor:default}
  a{color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted);font-size:14px}
  .err{color:var(--bad);font-size:14px}
  .pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.open{border-color:var(--warn);color:var(--warn)}
  .pill.done{border-color:#3c4a33;color:#7f8f73}
  .err-title{font-size:16px;margin:0 0 2px;word-break:break-word}
  .grid{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:12px 0;font-size:14px}
  .grid dt{color:var(--muted)}
  .grid dd{margin:0;word-break:break-word}
  pre{background:#0d120b;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:320px;white-space:pre-wrap;word-break:break-word}
  .hidden{display:none}
  @media(max-width:520px){.grid{grid-template-columns:1fr}.grid dt{margin-top:6px}}
 </style>
</head>
<body>
<header>
  <h1>Lanky Services — Server errors</h1>
  <div class="row">
    <a class="muted" href="/admin.html">Quotes</a>
    <span id="who" class="muted"></span>
    <button id="signout" class="ghost hidden">Sign out</button>
  </div>
</header>

<div class="wrap">
  <section id="authCard" class="card hidden" style="max-width:420px;margin:40px auto">
    <h2 style="margin-top:0;font-size:18px">Sign in</h2>
    <p class="muted">Admin access only. Use your approved business email.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="row" style="margin-top:14px">
      <button id="signin">Sign in</button>
    </div>
    <p id="authMsg" class="err" style="min-height:20px"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card row" style="justify-content:space-between">
      <div class="row">
        <label for="filter" style="margin:0">Show</label>
        <select id="filter" style="width:auto">
          <option value="open">Unresolved</option>
          <option value="all">All errors</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
      <button id="refresh" class="ghost">Refresh</button>
    </div>
    <p id="listMsg" class="muted"></p>
    <div id="list"></div>
  </section>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';

const SUPABASE_URL = 'https://rstabgnhargvqwasplst.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SsCPt15jfIBlV75qC3Wt7A_4mhanmSk';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const authCard = $('authCard'), app = $('app'), authMsg = $('authMsg');
const esc = (s) => String(s ?? '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const fmt = (iso) => new Date(iso).toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' });

async function render() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    authCard.classList.remove('hidden');
    app.classList.add('hidden');
    $('signout').classList.add('hidden');
    $('who').textContent = '';
    return;
  }
  authCard.classList.add('hidden');
  app.classList.remove('hidden');
  $('signout').classList.remove('hidden');
  $('who').textContent = user.email;
  await load();
}

async function load() {
  const mode = $('filter').value;
  $('listMsg').textContent = 'Loading…';
  let q = supabase.from('server_errors').select('*').order('created_at', { ascending: false }).limit(200);
  if (mode === 'open') q = q.eq('resolved', false);
  if (mode === 'resolved') q = q.eq('resolved', true);
  const { data, error } = await q;

  if (error) {
    $('listMsg').innerHTML = '<span class="err">' + esc(error.message) +
      ' — this account may not be on the approved admin list.</span>';
    $('list').innerHTML = '';
    return;
  }
  $('listMsg').textContent = data.length
    ? data.length + ' error' + (data.length === 1 ? '' : 's') + ' logged'
    : 'No errors logged — everything is running clean.';
  $('list').innerHTML = data.map(card).join('');
}

function card(e) {
  const rows = [
    ['When', esc(fmt(e.created_at))],
    ['Source', esc(e.source)],
    ['Route', e.route ? esc((e.method ? e.method + ' ' : '') + e.route) : null],
    ['Status', e.status ? esc(e.status) : null],
    ['Browser', e.user_agent ? esc(e.user_agent) : null],
    ['Context', e.context ? esc(JSON.stringify(e.context)) : null],
  ].filter(([, v]) => v);

  return `<article class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <h2 class="err-title">${esc(e.message)}</h2>
      <span class="pill ${e.resolved ? 'done' : 'open'}">${e.resolved ? 'Resolved' : 'Open'}</span>
    </div>
    <dl class="grid">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${e.stack ? `<details><summary class="muted">Stack trace</summary><pre>${esc(e.stack)}</pre></details>` : '<p class="muted">No stack trace captured.</p>'}
    <div class="row" style="margin-top:10px">
      <button data-toggle="${e.id}" data-resolved="${e.resolved}">${e.resolved ? 'Mark unresolved' : 'Mark resolved'}</button>
      <button data-delete="${e.id}" class="ghost">Delete</button>
    </div>
  </article>`;
}

$('list').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  btn.disabled = true;
  try {
    if (btn.dataset.toggle) {
      const next = btn.dataset.resolved !== 'true';
      const { error } = await supabase.from('server_errors').update({ resolved: next }).eq('id', btn.dataset.toggle);
      if (error) { btn.textContent = 'Update failed'; btn.disabled = false; return; }
      await load();
      return;
    }
    if (btn.dataset.delete) {
      const { error } = await supabase.from('server_errors').delete().eq('id', btn.dataset.delete);
      if (error) { btn.textContent = 'Delete failed'; btn.disabled = false; return; }
      await load();
    }
  } catch (_) { btn.disabled = false; }
});

$('filter').addEventListener('change', load);
$('refresh').addEventListener('click', async () => {
  $('refresh').disabled = true;
  await load();
  $('refresh').disabled = false;
});

$('signin').addEventListener('click', async () => {
  authMsg.textContent = '';
  const { error } = await supabase.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value,
  });
  if (error) authMsg.textContent = error.message; else render();
});

$('signout').addEventListener('click', async () => {
  await supabase.auth.signOut();
  render();
});

render();
</script>
</body>
</html>
