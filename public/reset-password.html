<!DOCTYPE html>
<html lang="en-AU">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Reset password | Lanky Services</title>
 <meta name="robots" content="noindex, nofollow" />
 <meta name="theme-color" content="#0a0d0b" />
 <link rel="icon" type="image/png" href="/favicon.png" />
 <style>
  :root{--bg:#0a0d0b;--panel:#12170f;--line:#26301f;--ink:#f3f6ef;--muted:#9aa793;--accent:#a3e635}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:420px;margin:60px auto;}
  h1{font-size:20px;margin:0 0 6px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0d120b;color:var(--ink);font:inherit;color-scheme:dark}
  button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font:600 15px/1 inherit;background:var(--accent);color:#10160c;margin-top:16px}
  button:disabled{opacity:.6;cursor:default}
  .muted{color:var(--muted);font-size:14px}
  .err{color:#ff9a8a;font-size:14px;min-height:20px}
  .ok{color:var(--accent);font-size:14px;min-height:20px}
  a{color:var(--accent)}
 </style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <p class="muted" id="intro">Checking your reset link…</p>

  <div id="form" style="display:none">
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" />
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" />
    <button id="save">Update password</button>
  </div>

  <p id="msg" class="err"></p>
  <p class="muted"><a href="/admin.html">Back to admin sign in</a></p>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.0';
const supabase = createClient(
  'https://rstabgnhargvqwasplst.supabase.co',
  'sb_publishable_SsCPt15jfIBlV75qC3Wt7A_4mhanmSk',
  { auth: { detectSessionInUrl: false, persistSession: true, flowType: 'implicit' } }
);
const $ = (id) => document.getElementById(id);
const msg = $('msg');

const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const query = new URLSearchParams(location.search);
const get = (k) => hash.get(k) || query.get(k);

function fail(text) {
  $('intro').textContent = '';
  msg.className = 'err';
  msg.textContent = text;
}

function showForm() {
  $('intro').textContent = 'Choose a new password for your admin account.';
  $('form').style.display = 'block';
  msg.textContent = '';
}

async function init() {
  const errDesc = get('error_description');
  if (errDesc) {
    fail(decodeURIComponent(errDesc.replace(/\+/g, ' ')) + ' — request a new reset link from the sign-in page.');
    return;
  }

  // 1) Hash tokens (implicit flow): #access_token=...&refresh_token=...
  const access_token = hash.get('access_token');
  const refresh_token = hash.get('refresh_token');
  if (access_token && refresh_token) {
    const { error } = await supabase.auth.setSession({ access_token, refresh_token });
    history.replaceState(null, '', location.pathname);
    if (error) return fail(error.message);
    return showForm();
  }

  // 2) Verification link: ?token_hash=...&type=recovery
  const token_hash = get('token_hash') || get('token');
  const type = get('type') || 'recovery';
  if (token_hash) {
    const { error } = await supabase.auth.verifyOtp({ type, token_hash });
    history.replaceState(null, '', location.pathname);
    if (error) return fail(error.message + ' — request a new reset link from the sign-in page.');
    return showForm();
  }

  // 3) PKCE link: ?code=...
  const code = get('code');
  if (code) {
    const { error } = await supabase.auth.exchangeCodeForSession(code);
    history.replaceState(null, '', location.pathname);
    if (error) return fail(error.message + ' — open the reset link in the same browser you requested it from.');
    return showForm();
  }

  // 4) Already signed in (e.g. page reloaded after a valid link)
  const { data: { session } } = await supabase.auth.getSession();
  if (session) return showForm();

  fail('This reset link is invalid or has expired. Request a new one from the sign-in page.');
}

$('save').addEventListener('click', async () => {
  msg.className = 'err';
  const pw = $('pw').value, pw2 = $('pw2').value;
  if (pw.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; return; }
  if (pw !== pw2) { msg.textContent = 'Passwords do not match.'; return; }
  $('save').disabled = true;
  const { error } = await supabase.auth.updateUser({ password: pw });
  if (error) { msg.textContent = error.message; $('save').disabled = false; return; }
  msg.className = 'ok';
  msg.textContent = 'Password updated. Redirecting to sign in…';
  await supabase.auth.signOut();
  setTimeout(() => { window.location.href = '/admin.html'; }, 1500);
});

init();
</script>
</body>
</html>
