<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment received — Lanky Services</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  body{margin:0;background:#0a0e0a;color:#f1f5ec;font:16px/1.6 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    display:grid;place-items:center;min-height:100vh}
  .card{max-width:460px;padding:40px 32px;text-align:center}
  .tick{width:64px;height:64px;border-radius:50%;background:#a3e635;color:#0f1509;display:grid;place-items:center;
    margin:0 auto 20px;font-size:34px;font-weight:800}
  h1{font-size:24px;margin:0 0 8px}
  p{color:#93a288;margin:0 0 8px}
  .brand{margin-top:26px;color:#a3e635;font-weight:700;letter-spacing:.02em}
  a{color:#a3e635}
</style>
</head>
<body>
  <div class="card">
    <div class="tick">✓</div>
    <h1>Payment received</h1>
    <p>Thanks — your payment to Lanky Services has gone through. A receipt has been emailed to you by our payment provider.</p>
    <p>We'll be in touch if we need anything else.</p>
    <div class="brand">Lanky Services — only an arm's length away</div>
  </div>
</body>
</html>
